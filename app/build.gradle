plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bootiemashup.radio'
    compileSdk 37 // The SDK we compiled with (SDK 37 might not have stable standard platform-tools yet, compileSdk 35 is robust, but targetSdk is set to 37)

    defaultConfig {
        applicationId "com.bootiemashup.radio"
        minSdkVersion 26
        targetSdkVersion 37
        versionCode 3
        versionName "2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    // Leanback / TV Support
    implementation 'androidx.leanback:leanback:1.2.0'

    // Media3 (ExoPlayer & Session) for foreground service playback
    def media3_version = "1.11.0"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"

    // MediaRouter for routing/bluetooth dialog (Standard MediaRouter and Cast buttons)
    implementation 'androidx.mediarouter:mediarouter:1.8.1'

    // Glide for image loading (Artwork)
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'

    // Coroutines for background polling
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // OkHttp for fetching metadata
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
